<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>גישה מוגבלת</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #070707;
      color: #eee;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .screen {
      width: min(90%, 420px);
      text-align: center;
      animation: appear 1.2s ease;
    }

    .symbol {
      color: #b52a2a;
      font-size: 55px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 36px;
      letter-spacing: 2px;
      margin: 25px 0;
    }

    .typing {
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      margin: 0 auto;
      max-width: 100%;
      animation: typing 3s steps(28, end) forwards;
      color: #aaa;
      font-size: 14px;
    }

    button {
      margin-top: 45px;
      padding: 15px 50px;
      background: transparent;
      color: #eee;
      border: 1px solid #a22;
      border-radius: 3px;
      font-size: 17px;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #a22;
      box-shadow: 0 0 25px #a223;
    }

    .hidden { display: none; }

    .warning {
      color: #d33;
      animation: flicker 2s infinite;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      50% { opacity: .25; transform: scale(1.08); }
    }

    @keyframes typing {
      to { width: 100%; }
    }

    @keyframes flicker {
      0%, 90%, 100% { opacity: 1; }
      93%, 97% { opacity: .2; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .typing { width: 100%; }
    }
  </style>
</head>
<body>

  <main id="first" class="screen">
    <div class="symbol">⛨</div>
    <h1>הגישה מוגבלת</h1>
    <p class="typing">לא היית אמור להגיע לכאן.</p>
    <button onclick="nextScreen()">המשך</button>
  </main>

  <section id="second" class="screen hidden">
    <div class="symbol warning">!</div>
    <h1 class="warning">הכניסה זוהתה</h1>
    <p>מצאת משהו שלא נועד להימצא.</p>
    <p style="color:#777">זהו רק תחילתו של הסיפור.</p>
    <button onclick="restart()">חזרה</button>
  </section>

  <script>
    // Keep the existing visit notification
    fetch(
      "https://kishur0maarehet.amitdorfberger.workers.dev/visit",
      { method: "POST" }
    ).catch(() => {});

    function nextScreen() {
      document.getElementById("first").classList.add("hidden");
      document.getElementById("second").classList.remove("hidden");
    }

    function restart() {
      document.getElementById("second").classList.add("hidden");
      document.getElementById("first").classList.remove("hidden");
    }
  </script>
</body>
</html>
