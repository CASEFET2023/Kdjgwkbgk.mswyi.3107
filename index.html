<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הגעת למקום הלא נכון</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .symbol {
      font-size: 52px;
      color: #e34b4b;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    p {
      color: #aeb4c0;
      font-size: 17px;
      line-height: 1.9;
    }

    .warning {
      display: none;
      margin-top: 35px;
      padding: 22px;
      border: 1px solid #8c3030;
      border-radius: 12px;
      background: #190e12;
      animation: fadeIn 1.5s ease;
    }

    .warning h2 {
      color: #ff6868;
      font-size: 23px;
    }

    .warning p {
      color: #f0dada;
    }

    .cursor {
      display: inline-block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="symbol">◇</div>

    <h1 id="title"></h1>
    <p id="message"></p>

    <section class="warning" id="warning">
      <h2>⚠ אזהרה</h2>
      <p>
        הגעת לאזור פרטי ומוגן.
        אין לך הרשאה לפגוע ברכוש או להמשיך
        בניסיון גישה למקום זה.
      </p>
      <p>
        הפסק כל פעולה והתרחק מהמקום.
      </p>
    </section>
  </main>

  <script>
    const title = "לא היית אמור למצוא את זה.";
    const message =
      "לפעמים, מה שנראה כמו סוף הדרך הוא רק ההתחלה.";

    function typeText(element, text, speed, done) {
      let i = 0;
      const timer = setInterval(() => {
        element.textContent += text.charAt(i);
        i++;

        if (i >= text.length) {
          clearInterval(timer);
          if (done) done();
        }
      }, speed);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const titleElement = document.getElementById("title");
      const messageElement = document.getElementById("message");
      const warning = document.getElementById("warning");

      typeText(titleElement, title, 75, () => {
        setTimeout(() => {
          typeText(messageElement, message, 45, () => {
            setTimeout(() => {
              warning.style.display = "block";
            }, 3000);
          });
        }, 800);
      });
    });
  </script>

</body>
</html>
